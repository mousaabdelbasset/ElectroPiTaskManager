name: electropi-task-manager

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: electropi-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - electropi_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api:
    image: electropi-api:local
    build:
      context: .
      dockerfile: ElectroPi.TaskManager.Api/Dockerfile
    container_name: electropi-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=ElectroPiTaskManagerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: electropi-frontend:local
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: electropi-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  electropi_sql_data: